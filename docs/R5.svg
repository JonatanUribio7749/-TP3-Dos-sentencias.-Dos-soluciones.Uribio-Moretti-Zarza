<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="svg-retiro"><title id="svg-retiro">Diagrama R5: entradas, decisiones y resultados</title><defs><marker id="arrow-retiro" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#718096" stroke-width="1.5"/></marker></defs><path d="M300 62V88" class="connector" marker-end="url(#arrow-retiro)"/><path d="M300 142V166" class="connector" marker-end="url(#arrow-retiro)"/><path d="M430 205H560" class="connector" marker-end="url(#arrow-retiro)"/><text x="480" y="193" class="branch">Sí</text><path d="M300 244V286" class="connector" marker-end="url(#arrow-retiro)"/><text x="315" y="270" class="branch">No</text><path d="M300 364V418" class="connector" marker-end="url(#arrow-retiro)"/><text x="315" y="395" class="branch">Sí</text><path d="M430 325H560" class="connector" marker-end="url(#arrow-retiro)"/><text x="480" y="313" class="branch">No</text><rect x="120" y="8" width="360" height="54" rx="12" class="node start"/><text x="300" y="40" text-anchor="middle" class="node-label">Confirmación recibida</text><rect x="120" y="88" width="360" height="54" rx="12" class="node normal"/><text x="300" y="120" text-anchor="middle" class="node-label">Consultar paquete y responsable</text><polygon points="170,205 300,166 430,205 300,244" class="node decision"/><text x="300" y="210" text-anchor="middle" class="node-label">¿Ya figura retirado?</text><rect x="560" y="178" width="360" height="54" rx="12" class="node human"/><text x="740" y="210" text-anchor="middle" class="node-label">Conservar fecha · revisión humana</text><polygon points="170,325 300,286 430,325 300,364" class="node decision"/><text x="300" y="330" text-anchor="middle" class="node-label">¿Listo Y confirma responsable?</text><rect x="120" y="418" width="360" height="54" rx="12" class="node success"/><text x="300" y="450" text-anchor="middle" class="node-label">Registrar fecha + estado retirado</text><rect x="560" y="298" width="360" height="54" rx="12" class="node human"/><text x="740" y="330" text-anchor="middle" class="node-label">Mantener estado · revisión humana</text><text x="300" y="496" text-anchor="middle" class="branch">Fin: resultado registrado</text><text x="740" y="390" text-anchor="middle" class="branch">Fin: pendiente de revisión humana</text><style>.connector{fill:none;stroke:#718096;stroke-width:2}.node{fill:#f0f2ee;stroke:#c9d1c7;stroke-width:1.5}.start{fill:#18251f}.start+.node-label{fill:white}.decision{fill:#fff8d8;stroke:#c3a530}.success{fill:#e1f0e5;stroke:#6b9c79}.human{fill:#fff0df;stroke:#c69457}.node-label{font:15px Arial;fill:#18251f}.branch{font:12px Arial;fill:#5c6860}</style></svg>